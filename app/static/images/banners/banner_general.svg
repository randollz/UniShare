<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="800" height="160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07091c"/>
      <stop offset="100%" stop-color="#0d1040"/>
    </linearGradient>
  </defs>
  <rect width="800" height="160" fill="url(#bg)"/>
  <!-- Dotted grid -->
  <pattern id="grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="1" fill="rgba(255,255,255,0.06)"/>
  </pattern>
  <rect x="520" y="0" width="280" height="160" fill="url(#grid)"/>
  <!-- Open book icon -->
  <g transform="translate(690, 80)">
    <path d="M 0 -35 L 0 35" stroke="rgba(245,200,66,0.4)" stroke-width="2"/>
    <path d="M 0 -35 Q -30 -40 -55 -28 L -55 35 Q -30 22 0 28" fill="rgba(245,200,66,0.08)" stroke="rgba(245,200,66,0.35)" stroke-width="1.5"/>
    <path d="M 0 -35 Q 30 -40 55 -28 L 55 35 Q 30 22 0 28" fill="rgba(245,200,66,0.08)" stroke="rgba(245,200,66,0.35)" stroke-width="1.5"/>
    <line x1="-42" y1="-14" x2="-15" y2="-20" stroke="rgba(245,200,66,0.25)" stroke-width="1"/>
    <line x1="-42" y1="-4" x2="-15" y2="-10" stroke="rgba(245,200,66,0.2)" stroke-width="1"/>
    <line x1="15" y1="-20" x2="42" y2="-14" stroke="rgba(245,200,66,0.25)" stroke-width="1"/>
    <line x1="15" y1="-10" x2="42" y2="-4" stroke="rgba(245,200,66,0.2)" stroke-width="1"/>
  </g>
  <!-- Left text -->
  <text x="40" y="52" fill="rgba(255,255,255,0.2)" font-family="sans-serif" font-size="9" font-weight="700" letter-spacing="0.12em">UNISHARE</text>
  <text x="40" y="90" fill="#fff" font-family="sans-serif" font-size="28" font-weight="800" letter-spacing="-0.03em">Study · Share · Succeed</text>
  <text x="40" y="118" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="13">University of Western Australia</text>
</svg>
