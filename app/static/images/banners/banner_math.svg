<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="800" height="160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e0b2e"/>
      <stop offset="100%" stop-color="#1e1260"/>
    </linearGradient>
  </defs>
  <rect width="800" height="160" fill="url(#bg)"/>
  <!-- Coordinate axis decoration -->
  <line x1="580" y1="140" x2="780" y2="140" stroke="rgba(245,200,66,0.25)" stroke-width="1.5"/>
  <line x1="580" y1="20" x2="580" y2="140" stroke="rgba(245,200,66,0.25)" stroke-width="1.5"/>
  <!-- Curve -->
  <path d="M 580 120 Q 630 60 680 80 Q 730 100 780 30" fill="none" stroke="rgba(245,200,66,0.5)" stroke-width="2"/>
  <!-- Grid lines faint -->
  <line x1="580" y1="80" x2="780" y2="80" stroke="rgba(245,200,66,0.1)" stroke-width="1"/>
  <line x1="680" y1="20" x2="680" y2="140" stroke="rgba(245,200,66,0.1)" stroke-width="1"/>
  <!-- Axis arrows -->
  <polygon points="780,136 776,144 784,144" fill="rgba(245,200,66,0.4)"/>
  <polygon points="576,20 580,14 584,20" fill="rgba(245,200,66,0.4)"/>
  <!-- Integral symbol floating -->
  <text x="730" y="76" fill="rgba(245,200,66,0.18)" font-family="serif" font-size="52">&#x222B;</text>
  <!-- Left text -->
  <text x="40" y="52" fill="rgba(255,255,255,0.2)" font-family="sans-serif" font-size="9" font-weight="700" letter-spacing="0.12em">MATHEMATICS</text>
  <text x="40" y="90" fill="#fff" font-family="sans-serif" font-size="28" font-weight="800" letter-spacing="-0.03em">Proofs · Calculus · Algebra</text>
  <text x="40" y="118" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="13">MATH units</text>
</svg>
