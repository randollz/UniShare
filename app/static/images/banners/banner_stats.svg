      <stop offset="0%" stop-color="#0a1f1f"/>
      <stop offset="100%" stop-color="#0f3030"/>
    </linearGradient>
  </defs>
  <rect width="800" height="160" fill="url(#bg)"/>
  <!-- Bar chart decoration -->
  <rect x="600" y="110" width="22" height="30" rx="2" fill="rgba(245,158,11,0.2)" stroke="rgba(245,158,11,0.4)" stroke-width="1"/>
  <rect x="630" y="85" width="22" height="55" rx="2" fill="rgba(245,158,11,0.35)" stroke="rgba(245,158,11,0.5)" stroke-width="1"/>
  <rect x="660" y="60" width="22" height="80" rx="2" fill="rgba(245,158,11,0.5)" stroke="rgba(245,158,11,0.6)" stroke-width="1"/>
  <rect x="690" y="35" width="22" height="105" rx="2" fill="rgba(245,158,11,0.7)" stroke="#f59e0b" stroke-width="1"/>
  <rect x="720" y="50" width="22" height="90" rx="2" fill="rgba(245,158,11,0.55)" stroke="#f59e0b" stroke-width="1"/>
  <rect x="750" y="70" width="22" height="70" rx="2" fill="rgba(245,158,11,0.35)" stroke="rgba(245,158,11,0.5)" stroke-width="1"/>
  <!-- Baseline -->
