  <text x="40" y="90" fill="#fff" font-family="sans-serif" font-size="28" font-weight="800" letter-spacing="-0.03em">Data · Models · Inference</text>
  <text x="40" y="118" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="13">STAT units</text>
