<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="800" height="160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0f2e"/>
      <stop offset="100%" stop-color="#1a2060"/>
    </linearGradient>
  </defs>
  <rect width="800" height="160" fill="url(#bg)"/>
  <!-- Circuit trace decorations -->
  <line x1="580" y1="0" x2="580" y2="160" stroke="rgba(59,110,245,0.08)" stroke-width="1"/>
  <line x1="640" y1="0" x2="640" y2="160" stroke="rgba(59,110,245,0.06)" stroke-width="1"/>
  <line x1="700" y1="0" x2="700" y2="160" stroke="rgba(59,110,245,0.05)" stroke-width="1"/>
  <line x1="560" y1="40" x2="800" y2="40" stroke="rgba(59,110,245,0.07)" stroke-width="1"/>
  <line x1="560" y1="80" x2="800" y2="80" stroke="rgba(59,110,245,0.07)" stroke-width="1"/>
  <line x1="560" y1="120" x2="800" y2="120" stroke="rgba(59,110,245,0.07)" stroke-width="1"/>
  <!-- Circuit nodes -->
  <circle cx="580" cy="40" r="3" fill="rgba(59,110,245,0.3)"/>
  <circle cx="640" cy="80" r="3" fill="rgba(59,110,245,0.3)"/>
  <circle cx="700" cy="40" r="3" fill="rgba(59,110,245,0.3)"/>
  <circle cx="580" cy="120" r="3" fill="rgba(59,110,245,0.3)"/>
  <circle cx="700" cy="120" r="3" fill="rgba(59,110,245,0.2)"/>
  <!-- Terminal icon (right side) -->
  <rect x="620" y="28" width="120" height="80" rx="8" fill="rgba(0,0,0,0.5)" stroke="rgba(59,110,245,0.4)" stroke-width="1.5"/>
  <circle cx="636" cy="42" r="3.5" fill="#ff5f57" opacity="0.7"/>
  <circle cx="649" cy="42" r="3.5" fill="#febc2e" opacity="0.7"/>
  <circle cx="662" cy="42" r="3.5" fill="#28c840" opacity="0.7"/>
  <text x="636" y="65" fill="#3b6ef5" font-family="monospace" font-size="14" font-weight="700">&gt;_</text>
  <rect x="636" y="72" width="80" height="2" rx="1" fill="rgba(59,110,245,0.4)"/>
  <rect x="636" y="80" width="55" height="2" rx="1" fill="rgba(59,110,245,0.25)"/>
  <rect x="636" y="88" width="68" height="2" rx="1" fill="rgba(59,110,245,0.2)"/>
  <!-- Left text -->
  <text x="40" y="52" fill="rgba(255,255,255,0.2)" font-family="sans-serif" font-size="9" font-weight="700" letter-spacing="0.12em">COMPUTER SCIENCE</text>
  <text x="40" y="90" fill="#fff" font-family="sans-serif" font-size="28" font-weight="800" letter-spacing="-0.03em">Code · Build · Ship</text>
  <text x="40" y="118" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="13">CITS · COMP units</text>
</svg>
