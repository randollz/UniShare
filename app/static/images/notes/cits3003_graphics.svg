<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="50%" stop-color="#2d1b69"/>
      <stop offset="100%" stop-color="#1e0a3c"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#bg)"/>

  <!-- 3D perspective grid -->
  <g stroke="rgba(249,115,22,0.15)" stroke-width="1" fill="none">
    <!-- Horizontal lines (perspective) -->
    <line x1="430" y1="100" x2="790" y2="160"/>
    <line x1="430" y1="145" x2="790" y2="195"/>
    <line x1="430" y1="190" x2="790" y2="230"/>
    <line x1="430" y1="235" x2="790" y2="265"/>
    <line x1="430" y1="280" x2="790" y2="300"/>
    <line x1="430" y1="325" x2="790" y2="335"/>
    <line x1="430" y1="370" x2="790" y2="370"/>
    <!-- Vertical lines (perspective) -->
    <line x1="430" y1="70" x2="430" y2="390"/>
    <line x1="490" y1="77" x2="490" y2="390"/>
    <line x1="550" y1="85" x2="550" y2="390"/>
    <line x1="610" y1="95" x2="610" y2="390"/>
    <line x1="670" y1="107" x2="670" y2="390"/>
    <line x1="730" y1="120" x2="730" y2="390"/>
    <line x1="790" y1="135" x2="790" y2="390"/>
  </g>

  <!-- 3D cube wireframe -->
  <g stroke="rgba(249,115,22,0.8)" stroke-width="1.5" fill="none">
    <!-- Front face -->
    <rect x="560" y="140" width="80" height="80"/>
    <!-- Back face (shifted) -->
    <rect x="590" y="110" width="80" height="80"/>
    <!-- Connecting edges -->
    <line x1="560" y1="140" x2="590" y2="110"/>
    <line x1="640" y1="140" x2="670" y2="110"/>
    <line x1="640" y1="220" x2="670" y2="190"/>
    <line x1="560" y1="220" x2="590" y2="190"/>
  </g>
  <!-- Cube face fill -->
  <rect x="560" y="140" width="80" height="80" fill="rgba(249,115,22,0.06)"/>
  <rect x="590" y="110" width="80" height="80" fill="rgba(239,68,68,0.04)"/>

  <!-- Shader gradient sphere -->
  <radialGradient id="sphere" cx="40%" cy="35%" r="60%">
    <stop offset="0%" stop-color="#f97316"/>
    <stop offset="50%" stop-color="#7c3aed"/>
    <stop offset="100%" stop-color="#1e0a3c"/>
  </radialGradient>
  <circle cx="690" cy="300" r="60" fill="url(#sphere)" opacity="0.7"/>
  <circle cx="690" cy="300" r="60" fill="none" stroke="rgba(249,115,22,0.3)" stroke-width="1"/>

  <!-- Shader code snippet -->
  <rect x="420" y="310" width="200" height="82" rx="5" fill="rgba(0,0,0,0.5)" stroke="rgba(249,115,22,0.2)" stroke-width="1"/>
  <g font-family="monospace" font-size="10" fill="rgba(249,115,22,0.8)">
    <text x="430" y="327">void main() {</text>
    <text x="430" y="343" fill="#c084fc">  vec3 norm = normalize(</text>
    <text x="430" y="359" fill="#c084fc">    vNormal);</text>
    <text x="430" y="375" fill="#60a5fa">  gl_FragColor = vec4(</text>
    <text x="430" y="388" fill="#60a5fa">    norm, 1.0); }</text>
  </g>

  <!-- Left content -->
  <rect x="44" y="52" width="86" height="24" rx="12" fill="url(#acc)" opacity="0.9"/>
  <text x="87" y="68" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">CITS3003</text>

  <text x="44" y="135" font-family="Inter, sans-serif" font-size="36" font-weight="900" fill="#fff" letter-spacing="-1">Computer</text>
  <text x="44" y="178" font-family="Inter, sans-serif" font-size="36" font-weight="900" fill="url(#acc)" letter-spacing="-1">Graphics</text>
  <text x="44" y="221" font-family="Inter, sans-serif" font-size="36" font-weight="900" fill="#fff" letter-spacing="-1">OpenGL</text>

  <text x="44" y="254" font-family="Inter, sans-serif" font-size="14" fill="rgba(255,255,255,0.5)">Shaders, Transforms, Lighting  ·  S1 2025</text>

  <g transform="translate(44, 278)">
    <rect width="70" height="26" rx="13" fill="rgba(249,115,22,0.15)" stroke="rgba(249,115,22,0.35)" stroke-width="1"/>
    <text x="35" y="17" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#fb923c" text-anchor="middle">GLSL</text>
  </g>
  <g transform="translate(124, 278)">
    <rect width="80" height="26" rx="13" fill="rgba(192,132,252,0.12)" stroke="rgba(192,132,252,0.3)" stroke-width="1"/>
    <text x="40" y="17" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">Lighting</text>
  </g>
  <g transform="translate(214, 278)">
    <rect width="80" height="26" rx="13" fill="rgba(96,165,250,0.12)" stroke="rgba(96,165,250,0.3)" stroke-width="1"/>
    <text x="40" y="17" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">Transforms</text>
  </g>

  <g font-family="Inter, sans-serif" font-size="13" fill="rgba(255,255,255,0.6)">
    <text x="44" y="344">✦  Vertex &amp; Fragment Shaders</text>
    <text x="44" y="364">✦  3D Transformations</text>
    <text x="44" y="384">✦  Phong Lighting Model</text>
  </g>

  <rect x="0" y="408" width="800" height="4" fill="url(#acc)"/>
  <rect x="0" y="412" width="800" height="8" fill="rgba(0,0,0,0.3)"/>
</svg>
