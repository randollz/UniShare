<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#bg)"/>

  <!-- Matrix bracket decoration -->
  <!-- Large matrix visual (right side) -->
  <g font-family="monospace" font-size="15" fill="rgba(56,189,248,0.7)" text-anchor="middle">
    <!-- Brackets -->
    <text x="435" y="110" font-size="120" fill="rgba(56,189,248,0.15)">⎡</text>
    <text x="435" y="210" font-size="120" fill="rgba(56,189,248,0.15)">⎢</text>
    <text x="435" y="310" font-size="120" fill="rgba(56,189,248,0.15)">⎣</text>
    <text x="775" y="110" font-size="120" fill="rgba(56,189,248,0.15)">⎤</text>
    <text x="775" y="210" font-size="120" fill="rgba(56,189,248,0.15)">⎥</text>
    <text x="775" y="310" font-size="120" fill="rgba(56,189,248,0.15)">⎦</text>

    <!-- Matrix values -->
    <text x="498" y="140">2</text>  <text x="558" y="140">-1</text>  <text x="618" y="140">0</text>  <text x="720" y="140">4</text>
    <text x="498" y="200">1</text>  <text x="558" y="200">3</text>   <text x="618" y="200">-2</text> <text x="720" y="200">1</text>
    <text x="498" y="260">0</text>  <text x="558" y="260">-1</text>  <text x="618" y="260">5</text>  <text x="720" y="260">-3</text>
    <text x="498" y="320">4</text>  <text x="558" y="320">0</text>   <text x="618" y="320">2</text>  <text x="720" y="320">7</text>
  </g>

  <!-- Eigenvalue annotation -->
  <g font-family="monospace" font-size="14" fill="rgba(129,140,248,0.8)">
    <text x="445" y="365">λ₁ = 3.7</text>
    <text x="530" y="365">λ₂ = 1.2</text>
    <text x="615" y="365">λ₃ = -0.9</text>
  </g>

  <!-- Eigenvector arrow -->
  <line x1="590" y1="190" x2="700" y2="130" stroke="rgba(129,140,248,0.4)" stroke-width="1.5" marker-end="none"/>
  <polygon points="700,120 695,135 710,130" fill="rgba(129,140,248,0.4)"/>

  <!-- Left content -->
  <rect x="44" y="52" width="86" height="24" rx="12" fill="url(#acc)" opacity="0.9"/>
  <text x="87" y="68" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">MATH2402</text>

  <text x="44" y="135" font-family="Inter, sans-serif" font-size="34" font-weight="900" fill="#fff" letter-spacing="-1">Linear</text>
  <text x="44" y="177" font-family="Inter, sans-serif" font-size="34" font-weight="900" fill="url(#acc)" letter-spacing="-1">Algebra</text>
  <text x="44" y="219" font-family="Inter, sans-serif" font-size="34" font-weight="900" fill="#fff" letter-spacing="-1">Summary</text>

  <text x="44" y="252" font-family="Inter, sans-serif" font-size="14" fill="rgba(255,255,255,0.5)">Eigenvalues, Vector Spaces  ·  S1 2025</text>

  <g transform="translate(44, 276)">
    <rect width="96" height="26" rx="13" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
    <text x="48" y="17" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Eigenvalues</text>
  </g>
  <g transform="translate(150, 276)">
    <rect width="84" height="26" rx="13" fill="rgba(129,140,248,0.12)" stroke="rgba(129,140,248,0.3)" stroke-width="1"/>
    <text x="42" y="17" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#818cf8" text-anchor="middle">SVD / LU</text>
  </g>

  <g font-family="Inter, sans-serif" font-size="13" fill="rgba(255,255,255,0.6)">
    <text x="44" y="342">✦  Vector Spaces &amp; Subspaces</text>
    <text x="44" y="362">✦  Matrix Decompositions</text>
    <text x="44" y="382">✦  Key Theorems with Proofs</text>
  </g>

  <rect x="0" y="408" width="800" height="4" fill="url(#acc)"/>
  <rect x="0" y="412" width="800" height="8" fill="rgba(0,0,0,0.3)"/>
</svg>
