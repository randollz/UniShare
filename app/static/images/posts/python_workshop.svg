<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1445"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="695" cy="70" r="125" fill="#3b82f6" opacity="0.13"/>
  <circle cx="750" cy="38" r="75" fill="#60a5fa" opacity="0.10"/>
  <circle cx="720" cy="375" r="90" fill="#1d4ed8" opacity="0.20"/>

  <!-- Curved decorative line (snake motif) -->
  <path d="M 650 0 C 710 90, 590 130, 680 215 C 750 275, 640 320, 710 420"
        fill="none" stroke="#fbbf24" stroke-width="2.5" opacity="0.18" stroke-linecap="round"/>

  <!-- Code editor window right side -->
  <rect x="490" y="72" width="272" height="206" rx="10" fill="#0f172a" opacity="0.82"/>
  <rect x="490" y="72" width="272" height="32" rx="10" fill="#1e293b"/>
  <rect x="490" y="92" width="272" height="12" rx="0" fill="#1e293b"/>
  <!-- window dots -->
  <circle cx="512" cy="88" r="5.5" fill="#ef4444"/>
  <circle cx="530" cy="88" r="5.5" fill="#fbbf24"/>
  <circle cx="548" cy="88" r="5.5" fill="#22c55e"/>
  <!-- filename tab -->
  <rect x="564" y="78" width="90" height="20" rx="4" fill="#0f172a"/>
  <text x="609" y="92" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#64748b" text-anchor="middle">workshop.py</text>
  <!-- code lines -->
  <rect x="510" y="118" width="55" height="7" rx="3" fill="#3b82f6" opacity="0.8"/>
  <rect x="572" y="118" width="90" height="7" rx="3" fill="#e2e8f0" opacity="0.5"/>
  <rect x="510" y="138" width="40" height="7" rx="3" fill="#a855f7" opacity="0.75"/>
  <rect x="558" y="138" width="70" height="7" rx="3" fill="#fbbf24" opacity="0.7"/>
  <rect x="522" y="158" width="130" height="7" rx="3" fill="#e2e8f0" opacity="0.45"/>
  <rect x="522" y="178" width="80" height="7" rx="3" fill="#22c55e" opacity="0.7"/>
  <rect x="510" y="198" width="50" height="7" rx="3" fill="#a855f7" opacity="0.75"/>
  <rect x="568" y="198" width="100" height="7" rx="3" fill="#fbbf24" opacity="0.65"/>
  <rect x="522" y="218" width="110" height="7" rx="3" fill="#3b82f6" opacity="0.7"/>
  <rect x="522" y="238" width="65" height="7" rx="3" fill="#22c55e" opacity="0.6"/>
  <!-- cursor blink -->
  <rect x="510" y="252" width="8" height="13" rx="1" fill="#67e8f9" opacity="0.9"/>

  <!-- Left accent bar - yellow -->
  <rect x="60" y="135" width="5" height="150" rx="2.5" fill="url(#yellowGrad)"/>

  <!-- Series label -->
  <text x="76" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif"
        font-size="11.5" font-weight="700" fill="#93c5fd" letter-spacing="3.5">
    WORKSHOP SERIES  ·  SEMESTER 1 2025
  </text>

  <!-- Main title line 1 -->
  <text x="76" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif"
        font-size="50" font-weight="900" fill="white">Python for</text>

  <!-- Main title line 2 -->
  <text x="76" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif"
        font-size="50" font-weight="900" fill="url(#yellowGrad)">Data Science</text>

  <!-- Tagline -->
  <text x="76" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif"
        font-size="14.5" fill="#bfdbfe">
    Pandas  ·  NumPy  ·  Matplotlib  ·  Scikit-learn
  </text>

  <!-- Schedule detail -->
  <rect x="76" y="312" width="10" height="10" rx="2" fill="#fbbf24"/>
  <text x="94" y="321" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif"
        font-size="13.5" fill="#e0f2fe">Every Wednesday  ·  6 – 8 pm</text>

  <!-- Venue detail -->
  <rect x="76" y="338" width="10" height="10" rx="2" fill="#fbbf24"/>
  <text x="94" y="347" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif"
        font-size="13.5" fill="#e0f2fe">CS Building  ·  Room 101  ·  Free entry</text>

  <!-- Skill badge -->
  <rect x="76" y="368" width="150" height="30" rx="15" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1"/>
  <text x="151" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif"
        font-size="12" font-weight="600" fill="#93c5fd" text-anchor="middle">All skill levels welcome</text>

  <!-- Python version badge -->
  <rect x="238" y="368" width="112" height="30" rx="15" fill="url(#yellowGrad)"/>
  <text x="294" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif"
        font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Python 3.12</text>
</svg>
