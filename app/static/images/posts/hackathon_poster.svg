<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#2d1b69"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="prizeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bgGrad)"/>

  <!-- Decorative circles top-right -->
  <circle cx="680" cy="55" r="140" fill="#7c3aed" opacity="0.22"/>
  <circle cx="735" cy="25" r="90" fill="#a855f7" opacity="0.18"/>
  <circle cx="615" cy="105" r="65" fill="#6d28d9" opacity="0.28"/>

  <!-- Bottom-left glow -->
  <circle cx="55" cy="395" r="80" fill="#4c1d95" opacity="0.32"/>

  <!-- Subtle hexagon grid top-right -->
  <g opacity="0.07" fill="none" stroke="#a78bfa" stroke-width="1.5">
    <polygon points="698,50 718,61 718,85 698,96 678,85 678,61"/>
    <polygon points="738,50 758,61 758,85 738,96 718,85 718,61"/>
    <polygon points="718,85 738,96 738,120 718,131 698,120 698,96"/>
    <polygon points="758,85 778,96 778,120 758,131 738,120 738,96"/>
    <polygon points="698,120 718,131 718,155 698,166 678,155 678,131"/>
    <polygon points="738,120 758,131 758,155 738,166 718,155 718,131"/>
  </g>

  <!-- Left accent bar -->
  <rect x="60" y="148" width="5" height="130" rx="2.5" fill="url(#accentGrad)"/>

  <!-- Organisation label -->
  <text x="76" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif"
        font-size="11.5" font-weight="700" fill="#a78bfa" letter-spacing="3.5">
    UWA COMPUTING SOCIETY
  </text>

  <!-- Main title -->
  <text x="76" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif"
        font-size="62" font-weight="900" fill="white" letter-spacing="-1.5">
    HACKATHON
  </text>

  <!-- Year – accent gradient -->
  <text x="76" y="263" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif"
        font-size="62" font-weight="900" letter-spacing="-1.5" fill="url(#accentGrad)">
    2025
  </text>

  <!-- Tagline -->
  <text x="76" y="303" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif"
        font-size="15.5" fill="#c4b5fd" letter-spacing="0.3">
    48 Hours  ·  One Big Idea  ·  Change the Campus
  </text>

  <!-- Date detail -->
  <rect x="76" y="324" width="10" height="10" rx="2" fill="#a78bfa"/>
  <text x="94" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif"
        font-size="13.5" fill="#ddd6fe">14 – 16 March 2025</text>

  <!-- Venue detail -->
  <rect x="76" y="350" width="10" height="10" rx="2" fill="#a78bfa"/>
  <text x="94" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif"
        font-size="13.5" fill="#ddd6fe">UWA Computer Science Building</text>

  <!-- Prize pill -->
  <rect x="510" y="320" width="232" height="54" rx="27" fill="url(#prizeGrad)"/>
  <text x="626" y="353" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif"
        font-size="20" font-weight="800" fill="white" text-anchor="middle">$5,000 in prizes</text>

  <!-- Register line -->
  <text x="626" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif"
        font-size="11.5" fill="#c4b5fd" text-anchor="middle" letter-spacing="1.5">
    REGISTER  ·  discord.gg/uwacomp
  </text>
</svg>
