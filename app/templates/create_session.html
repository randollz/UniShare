{% extends 'base.html' %}
{% block title %}New Session — UniShare{% endblock %}
{% block content %}
<div class="page-inner" style="max-width:560px">
    <h1 style="margin-bottom:28px">Create a study session</h1>
    <form method="POST" class="form-card">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="mb-3">
            <label for="session-title" class="form-label">Title <span class="required">*</span></label>
            <input type="text" id="session-title" name="title" class="form-control" required placeholder="e.g. CITS3403 Exam Prep" />
        </div>
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label for="session-unit" class="form-label">Unit code <span class="required">*</span></label>
                <input type="text" id="session-unit" name="unit_code" class="form-control" required placeholder="CITS3403" style="text-transform:uppercase" />
            </div>
            <div class="col-md-6">
                <label for="session-max" class="form-label">Max attendees</label>
                <input type="number" id="session-max" name="max_attendees" class="form-control" min="2" placeholder="10" />
            </div>
        </div>
        <div class="mb-3">
            <label for="session-date" class="form-label">Date &amp; time <span class="required">*</span></label>
            <input type="datetime-local" id="session-date" name="session_date" class="form-control" required />
        </div>
        <div class="mb-3">
            <label for="session-loc" class="form-label">Location</label>
            <input type="text" id="session-loc" name="location" class="form-control" placeholder="Reid Library Level 2" />
        </div>
        <div class="mb-3">
            <label for="session-desc" class="form-label">Description</label>
            <textarea id="session-desc" name="description" class="form-control" rows="3" placeholder="What will you cover?"></textarea>
        </div>
        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-dark">Create session</button>
            <a href="{{ url_for('study_sessions') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
