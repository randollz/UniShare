{% extends 'base.html' %}
{% block title %}Post Bounty — UniShare{% endblock %}
{% block content %}
<div class="page-inner" style="max-width:560px">
    <h1 style="margin-bottom:28px">Post a bounty</h1>
    <form method="POST" class="form-card">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <div class="mb-3">
            <label for="bounty-title" class="form-label">Title <span class="required">*</span></label>
            <input type="text" id="bounty-title" name="title" class="form-control" required placeholder="e.g. Help me debug Python assignment" />
        </div>
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label for="bounty-unit" class="form-label">Unit code</label>
                <input type="text" id="bounty-unit" name="unit_code" class="form-control" placeholder="CITS1401" style="text-transform:uppercase" />
            </div>
            <div class="col-md-6">
                <label for="bounty-reward" class="form-label">Reward ($)</label>
                <input type="number" id="bounty-reward" name="reward" class="form-control" min="0" step="0.01" placeholder="20.00" />
            </div>
        </div>
        <div class="mb-3">
            <label for="bounty-desc" class="form-label">Description</label>
            <textarea id="bounty-desc" name="description" class="form-control" rows="3" placeholder="What do you need help with?"></textarea>
        </div>
        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-dark">Post bounty</button>
            <a href="{{ url_for('bounties') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
